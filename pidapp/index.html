<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PID Cart on Spring</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1b1f25;
    --panel2: #232932;
    --ink: #e6e9ef;
    --muted: #8a93a3;
    --accent: #4ea1ff;
    --good: #66bb6a;
    --grid: #2a313c;
    --cP: #ef5350;  /* P - red */
    --cI: #f6c945;  /* I - yellow */
    --cD: #26c6da;  /* D - cyan */
    --cU: #ffffff;  /* total - white */
    --cW: #f6a623;  /* wind - orange */
    --cRef: #66bb6a; /* ref - green */
    --cX: #4ea1ff;   /* x - blue */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 13px/1.35 ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial;
  }
  /* iOS Safari refuses to scroll an iframe document itself, but it WILL scroll
     an explicitly-sized overflow container inside the iframe. Lock body to the
     iframe box, then let .scroll-host be the actual scroll surface. */
  .scroll-host {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  .app {
    display: flex; flex-direction: column;
    gap: 10px; padding: 10px;
    min-height: 100vh;     /* fallback: pre-Safari 15.4 / pre-Chrome 108 */
    min-height: 100dvh;    /* dynamic viewport — accounts for mobile chrome */
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 10px; background: var(--panel); border-radius: 8px;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header .sp { flex: 1; }
  header button {
    background: var(--panel2); color: var(--ink);
    border: 1px solid #2e3642; border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  header button:hover { border-color: var(--accent); }

  /* Stage layout:
     row 1: anim canvas | plot canvas
     row 2: ref slider  | readout
     row 3: pid + cart  | (empty)
  */
  .stage {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: minmax(340px, 58dvh) auto auto;
    gap: 10px;
  }
  .cv-box, .plot-box {
    background: var(--panel); border-radius: 8px; padding: 8px;
    display: flex;
  }
  .cv-box canvas, .plot-box canvas {
    width: 100%; height: 100%; display: block; border-radius: 6px;
    background: #0d1013;
  }
  .cv-box canvas { touch-action: none; cursor: grab; }
  .cv-box canvas.grabbing { cursor: grabbing; }
  .cv-box canvas.hover-cart { cursor: grab; }
  .cv-box { grid-column: 1; grid-row: 1; }
  .plot-box { grid-column: 2; grid-row: 1; }

  .ref-row {
    grid-column: 1; grid-row: 2;
    background: var(--panel); border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .readout {
    grid-column: 2; grid-row: 2 / span 2;
    background: var(--panel); border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .readout h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    margin: 0 0 4px 0; color: var(--muted); font-weight: 600;
  }
  .readout .ln { display: flex; justify-content: space-between; color: var(--muted); }
  .readout .ln b { color: var(--ink); font-weight: 600; }
  .readout .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: middle;
  }

  .sub-panels {
    grid-column: 1; grid-row: 3;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .box {
    background: var(--panel); border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .box h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    margin: 0; color: var(--muted); font-weight: 600;
  }
  .box h3 {
    font-size: 11px; margin: 8px 0 0 0; color: var(--muted); font-weight: 500;
    border-top: 1px solid #2a313c; padding-top: 6px;
  }

  .tabs {
    display: flex; gap: 2px;
    border-bottom: 1px solid #2a313c;
    margin: -2px 0 2px 0;
  }
  .tabs button {
    background: transparent; color: var(--muted);
    border: 0; border-bottom: 2px solid transparent;
    padding: 5px 10px; cursor: pointer; font: inherit;
    text-transform: uppercase; letter-spacing: 0.8px; font-size: 11px; font-weight: 600;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-body[hidden] { display: none; }

  .row {
    display: grid;
    grid-template-columns: 48px 1fr 72px;
    align-items: center; gap: 8px;
  }
  .row label { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row label[title] { cursor: help; border-bottom: 1px dotted var(--muted); }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row input[type=number] {
    background: var(--panel2); color: var(--ink);
    border: 1px solid #2e3642; border-radius: 4px;
    padding: 3px 5px; width: 100%;
    font: inherit; font-variant-numeric: tabular-nums;
  }
  .row input[type=number]:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  .pair { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pair button {
    background: var(--panel2); color: var(--ink);
    border: 1px solid #2e3642; border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font-size: 12px;
  }
  .pair button:hover { border-color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 4px; }
</style>
</head>
<body>
<div class="scroll-host">
<div class="app">
  <header>
    <h1>PID Cart on Spring</h1>
    <span class="sp"></span>
    <button id="btn-reset">Reset state</button>
    <button id="btn-rest">Reset to rest</button>
    <button id="btn-pause">Pause</button>
  </header>

  <section class="stage">
    <div class="cv-box"><canvas id="cv"></canvas></div>
    <div class="plot-box"><canvas id="plot"></canvas></div>

    <div class="ref-row" id="ref-row">
      <h2 style="margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:600;">Reference</h2>
    </div>

    <div class="readout" id="readout">
      <h2>State</h2>
      <div class="ln"><span>x</span><b><span id="r-x">0.00</span> m</b></div>
      <div class="ln"><span>v</span><b><span id="r-v">0.00</span> m/s</b></div>
      <div class="ln"><span>err</span><b><span id="r-e">0.00</span> m</b></div>
      <div class="ln"><span>∫err</span><b><span id="r-i">0.00</span></b></div>
      <div class="ln"><span>sim t</span><b><span id="r-t">0.00</span> s</b></div>
      <div class="ln"><span>fps</span><b><span id="r-fps">--</span></b></div>
      <h2>Forces (N)</h2>
      <div class="ln"><span><i class="swatch" style="background:var(--cP)"></i>P</span><b id="r-up">0.00</b></div>
      <div class="ln"><span><i class="swatch" style="background:var(--cI)"></i>I</span><b id="r-ui">0.00</b></div>
      <div class="ln"><span><i class="swatch" style="background:var(--cD)"></i>D</span><b id="r-ud">0.00</b></div>
      <div class="ln"><span><i class="swatch" style="background:var(--cU)"></i>u total</span><b id="r-u">0.00</b></div>
      <div class="ln"><span><i class="swatch" style="background:var(--cW)"></i>wind</span><b id="r-w">0.00</b></div>
    </div>

    <div class="sub-panels">
      <div class="box" id="box-pid">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="pid">PID</button>
          <button type="button" class="tab" data-tab="bangbang">Bang-bang</button>
        </div>
        <div class="tab-body" data-body="pid" id="tab-pid"></div>
        <div class="tab-body" data-body="bangbang" id="tab-bangbang" hidden></div>
      </div>
      <div class="box" id="box-cart-env">
        <h2>Cart &amp; spring</h2>
      </div>
    </div>
  </section>

  <footer>
    Ref maps 1:1 to the x-axis in meters. m·ẍ = −k·(x−L₀) + F_bumper − c·ẋ + u + F_wind. RK4 at 240 Hz, wall at x=0 with bumper spring.
  </footer>
</div>
</div>

<script>
"use strict";

// ---------- Parameter registry ----------------------------------------------
const P = {
  ref:    { label: "ref",  min: 0.3,  max: 4.5, step: 0.01, value: 2.0 },
  kp:     { label: "P",    min: 0,    max: 400, step: 0.1,  value: 0   },
  ki:     { label: "I",    min: 0,    max: 400, step: 0.1,  value: 0   },
  kd:     { label: "D",    min: 0,    max: 100, step: 0.05, value: 0   },
  iClamp: { label: "Imax", min: 0,    max: 400, step: 1,    value: 400,
            tip: "Anti-windup clamp: maximum |uI| (integral force contribution, N). The integrator accumulates effort directly, so this bounds the I term in the same units as uMax." },
  uMax:   { label: "uMax", min: 0,    max: 1000,step: 1,    value: 1000,
            tip: "Actuator saturation: |u| is clamped to this value after summing P+I+D. Simulates a real actuator's force limit." },
  dead:   { label: "dead", min: 0,    max: 2,   step: 0.01, value: 0.10,
            tip: "Bang-bang deadband width (m). The controller toggles only when |error| exceeds half this width." },
  effort: { label: "eff",  min: 0,    max: 1000,step: 1,    value: 200,
            tip: "Bang-bang effort magnitude (N). Sign flips automatically with ref vs. spring equilibrium." },
  wind:   { label: "wind", min: -200, max: 200, step: 0.1,  value: 0   },
  mass:   { label: "m",    min: 0.1,  max: 1000,step: 0.01, value: 1.0, log: true },
  drag:   { label: "c",    min: 0,    max: 20,  step: 0.01, value: 0.5 },
  k:      { label: "k",    min: 0,    max: 200, step: 0.1,  value: 20  },
};

// Spring model constants (not user-tunable)
const L0 = 2.0;          // main spring natural length (m) from wall
const X_BUMP = 0.35;     // bumper spring engage zone (cart position in m)
const K_BUMP = 5000;     // bumper stiffness (N/m)
const CART_HALF_W_M = 0.18; // cart half width in meters (for wall-clip)

function mkRow(parent, key) {
  const cfg = P[key];
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  lab.textContent = cfg.label;
  if (cfg.tip) lab.title = cfg.tip;
  const rng = document.createElement("input");
  rng.type = "range";
  const num = document.createElement("input");
  num.type = "number";
  num.min = cfg.min; num.max = cfg.max; num.step = cfg.step;
  num.value = cfg.value;

  // Log-scaled slider: internally slider is 0..1, mapped exp/log around value
  const logMode = !!cfg.log && cfg.min > 0 && cfg.max > cfg.min;
  const lmin = logMode ? Math.log(cfg.min) : 0;
  const lmax = logMode ? Math.log(cfg.max) : 0;
  const sliderFromValue = (v) => {
    if (logMode) {
      const clamped = Math.max(cfg.min, Math.min(cfg.max, v));
      return (Math.log(clamped) - lmin) / (lmax - lmin);
    }
    return Math.max(cfg.min, Math.min(cfg.max, v));
  };
  const valueFromSlider = (s) => logMode ? Math.exp(lmin + s * (lmax - lmin)) : s;

  if (logMode) { rng.min = 0; rng.max = 1; rng.step = 0.0005; }
  else        { rng.min = cfg.min; rng.max = cfg.max; rng.step = cfg.step; }
  rng.value = sliderFromValue(cfg.value);

  const commit = (raw, src) => {
    let v;
    if (src === "rng") v = valueFromSlider(Number(raw));
    else               v = Number(raw);
    if (!Number.isFinite(v)) return;
    cfg.value = v;
    if (src !== "rng") rng.value = sliderFromValue(v);
    if (src !== "num") num.value = logMode ? Number(v.toPrecision(4)) : v;
  };
  rng.addEventListener("input", () => commit(rng.value, "rng"));
  num.addEventListener("input", () => commit(num.value, "num"));
  row.append(lab, rng, num);
  parent.appendChild(row);
  cfg._row = row;
  cfg._sliderFromValue = sliderFromValue; // for programmatic preset buttons
}

function syncSlider(key) {
  const cfg = P[key];
  if (!cfg || !cfg._row) return;
  const rng = cfg._row.querySelector('input[type=range]');
  const num = cfg._row.querySelector('input[type=number]');
  if (rng) rng.value = cfg._sliderFromValue ? cfg._sliderFromValue(cfg.value) : cfg.value;
  if (num) num.value = cfg.value;
}

// Build UI
const refBox = document.getElementById("ref-row");
const pidBox = document.getElementById("box-pid");
const ceBox  = document.getElementById("box-cart-env");

mkRow(refBox, "ref");
{
  const qr = document.createElement("div");
  qr.className = "pair";
  for (const v of [0.5, 1, 2, 3, 4]) {
    const b = document.createElement("button");
    b.textContent = v.toFixed(1);
    b.addEventListener("click", () => {
      P.ref.value = v;
      P.ref._row.querySelector('input[type=range]').value = v;
      P.ref._row.querySelector('input[type=number]').value = v;
    });
    qr.appendChild(b);
  }
  refBox.appendChild(qr);
}

const tabPid = document.getElementById("tab-pid");
const tabBB  = document.getElementById("tab-bangbang");

mkRow(tabPid, "kp");
mkRow(tabPid, "ki");
mkRow(tabPid, "kd");
mkRow(tabPid, "iClamp");
mkRow(tabPid, "uMax");
{
  const row = document.createElement("div");
  row.className = "pair";
  const b1 = document.createElement("button");
  b1.textContent = "Reset ∫";
  b1.addEventListener("click", () => { state.I = 0; });
  const b2 = document.createElement("button");
  b2.textContent = "Zero I,D";
  b2.addEventListener("click", () => {
    P.ki.value = 0; P.kd.value = 0;
    for (const k of ["ki","kd"]) syncSlider(k);
  });
  row.append(b1, b2);
  tabPid.appendChild(row);
}

mkRow(tabBB, "dead");
mkRow(tabBB, "effort");
{
  const note = document.createElement("div");
  note.style.cssText = "color:var(--muted);font-size:11px;line-height:1.4;";
  note.innerHTML =
    "Output is +eff when cart sits on the wrong side of ref by more than ½·dead, " +
    "0 when it crosses to the other side of ref by more than ½·dead (hysteresis). " +
    "Sign flips with <b>ref vs spring equilibrium</b> (L₀ = " + L0.toFixed(2) + " m).";
  tabBB.appendChild(note);
}

// Cart & spring (mass, drag, k) + Environment (wind) stacked in one box
mkRow(ceBox, "mass");
mkRow(ceBox, "drag");
mkRow(ceBox, "k");
{
  const h = document.createElement("h3");
  h.textContent = "Environment";
  ceBox.appendChild(h);
}
mkRow(ceBox, "wind");
{
  const row = document.createElement("div");
  row.className = "pair";
  for (const v of [-50, 0, 50]) {
    const b = document.createElement("button");
    b.textContent = v === 0 ? "calm" : (v > 0 ? "→ " + v : "← " + Math.abs(v));
    b.addEventListener("click", () => {
      P.wind.value = v;
      P.wind._row.querySelector('input[type=range]').value = v;
      P.wind._row.querySelector('input[type=number]').value = v;
    });
    row.appendChild(b);
  }
  ceBox.appendChild(row);
}

// ---------- Simulation state ------------------------------------------------
const state = {
  x: L0, v: 0, I: 0, ePrev: 0, t: 0, paused: false,
  dragging: false, dragOffsetM: 0,
  mode: "pid",   // "pid" or "bangbang"
  bbOn: false,   // bang-bang current effort state
};
// Last-rendered geometry so pointer hit-tests match what's on screen.
const viewGeom = { W: 1, H: 1, cartSx: 0, cartCy: 0, bodyW: 0, bodyH: 0, wheelR: 0, axleY: 0 };
// latest controller components for render/readout/plot
let lastE = 0, lastUP = 0, lastUI = 0, lastUD = 0, lastU = 0;

function resetState() {
  state.x = L0; state.v = 0; state.I = 0; state.ePrev = 0; state.t = 0;
  lastE = lastUP = lastUI = lastUD = lastU = 0;
  // clear plot history
  hist.length = 0;
  lastHistT = -Infinity;
}
document.getElementById("btn-reset").addEventListener("click", resetState);
document.getElementById("btn-rest").addEventListener("click", () => {
  resetState();
  P.ref.value = L0;
  syncSlider("ref");
});
const btnPause = document.getElementById("btn-pause");
btnPause.addEventListener("click", () => {
  state.paused = !state.paused;
  btnPause.textContent = state.paused ? "Resume" : "Pause";
});

// Tab switching for PID / Bang-bang
document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-body").forEach(body => {
      body.hidden = (body.dataset.body !== tab);
    });
    state.mode = tab;
    // Clear stale controller state on mode switch so plots aren't confusing
    state.I = 0;
    state.ePrev = 0;
    state.bbOn = false;
  });
});

// ---------- Physics ---------------------------------------------------------
function springForce(x) {
  // Main spring about L0 + bumper spring near wall
  let F = -P.k.value * (x - L0);
  if (x < X_BUMP) F += K_BUMP * (X_BUMP - x);
  return F;
}
function accel(x, v, u) {
  const m = Math.max(1e-6, P.mass.value);
  return (springForce(x) - P.drag.value * v + u + P.wind.value) / m;
}
function rk4Step(dt, u) {
  const x = state.x, v = state.v;
  const k1x = v;
  const k1v = accel(x, v, u);
  const k2x = v + 0.5 * dt * k1v;
  const k2v = accel(x + 0.5 * dt * k1x, v + 0.5 * dt * k1v, u);
  const k3x = v + 0.5 * dt * k2v;
  const k3v = accel(x + 0.5 * dt * k2x, v + 0.5 * dt * k2v, u);
  const k4x = v + dt * k3v;
  const k4v = accel(x + dt * k3x, v + dt * k3v, u);
  let nx = x + (dt / 6) * (k1x + 2 * k2x + 2 * k3x + k4x);
  let nv = v + (dt / 6) * (k1v + 2 * k2v + 2 * k3v + k4v);
  // Hard-wall safety net at x = CART_HALF_W_M (cart body left edge at 0)
  if (nx < CART_HALF_W_M) { nx = CART_HALF_W_M; if (nv < 0) nv = 0; }
  state.x = nx; state.v = nv;
}
function controller(dt) {
  const e = P.ref.value - state.x;
  if (state.mode === "bangbang") {
    // Direction of effort determined by where ref sits relative to spring equilibrium.
    // ref > L0 -> spring pulls cart left, so hold it right with +effort.
    // ref < L0 -> spring pushes cart right, so hold it left with -effort.
    const dir = (P.ref.value > L0) ? 1 : (P.ref.value < L0 ? -1 : 0);
    const half = P.dead.value / 2;
    if (dir > 0) {
      // Hysteresis: turn ON when cart lags below ref by >half; turn OFF when it leads above by >half
      if (e >  half) state.bbOn = true;
      else if (e < -half) state.bbOn = false;
    } else if (dir < 0) {
      // Flipped edges: turn ON when cart leads above ref by >half; turn OFF when it lags below by >half
      if (e < -half) state.bbOn = true;
      else if (e >  half) state.bbOn = false;
    } else {
      state.bbOn = false;
    }
    const uRaw = state.bbOn ? dir * P.effort.value : 0;
    const uCap = P.uMax.value;
    const u = Math.max(-uCap, Math.min(uCap, uRaw));
    state.ePrev = e;
    return { u, uP: 0, uI: 0, uD: 0, e };
  }
  // PID mode
  // Integrate the integral control effort itself (not the raw error). This way
  // a change in ki only affects the rate of future accumulation — it doesn't
  // retroactively rescale the accumulated history and cause a force jump.
  const Inew = state.I + P.ki.value * 0.5 * (e + state.ePrev) * dt;
  const Imax = P.iClamp.value;
  state.I = Math.max(-Imax, Math.min(Imax, Inew));
  const dedt = -state.v;  // derivative-on-measurement
  const uP = P.kp.value * e;
  const uI = state.I;
  const uD = P.kd.value * dedt;
  const uRaw = uP + uI + uD;
  const uCap = P.uMax.value;
  const u = Math.max(-uCap, Math.min(uCap, uRaw));
  state.ePrev = e;
  return { u, uP, uI, uD, e };
}

// ---------- Plot history (ring) --------------------------------------------
const HIST_WINDOW_S = 10;
const HIST_RATE_HZ = 60;
const HIST_MAX = HIST_WINDOW_S * HIST_RATE_HZ;
const hist = []; // {t, ref, x, uP, uI, uD, u, wind}
let lastHistT = -Infinity;

function pushHist() {
  const dt = state.t - lastHistT;
  if (dt < 1 / HIST_RATE_HZ) return;
  lastHistT = state.t;
  const half = P.dead.value / 2;
  hist.push({
    t: state.t, ref: P.ref.value, x: state.x,
    uP: lastUP, uI: lastUI, uD: lastUD, u: lastU, wind: P.wind.value,
    deadHi: P.ref.value + half, deadLo: P.ref.value - half,
  });
  while (hist.length > HIST_MAX) hist.shift();
}

// ---------- Fixed-timestep loop --------------------------------------------
const PHYS_HZ = 240;
const PHYS_DT = 1 / PHYS_HZ;
let accumulator = 0;
let lastMs = performance.now();

let fpsFrames = 0, fpsT = performance.now(), fpsVal = 0;

function step(nowMs) {
  const dt = Math.min(0.1, (nowMs - lastMs) / 1000);
  lastMs = nowMs;
  if (!state.paused) {
    accumulator += dt;
    if (accumulator > 0.25) accumulator = 0.25;
    while (accumulator >= PHYS_DT) {
      const c = controller(PHYS_DT);
      lastUP = c.uP; lastUI = c.uI; lastUD = c.uD; lastU = c.u; lastE = c.e;
      if (state.dragging) {
        // Held by pointer — pin velocity to zero; controller still runs so I accumulates
        state.v = 0;
      } else {
        rk4Step(PHYS_DT, c.u);
      }
      state.t += PHYS_DT;
      accumulator -= PHYS_DT;
    }
    pushHist();
  }
  render();
  renderPlots();
  updateReadout();
  fpsFrames++;
  if (nowMs - fpsT >= 500) {
    fpsVal = Math.round((fpsFrames * 1000) / (nowMs - fpsT));
    fpsFrames = 0; fpsT = nowMs;
  }
  requestAnimationFrame(step);
}

// ---------- Readout ---------------------------------------------------------
const R = {
  x:  document.getElementById("r-x"),
  v:  document.getElementById("r-v"),
  e:  document.getElementById("r-e"),
  i:  document.getElementById("r-i"),
  t:  document.getElementById("r-t"),
  fps:document.getElementById("r-fps"),
  uP: document.getElementById("r-up"),
  uI: document.getElementById("r-ui"),
  uD: document.getElementById("r-ud"),
  u:  document.getElementById("r-u"),
  w:  document.getElementById("r-w"),
};
function updateReadout() {
  R.x.textContent = state.x.toFixed(3);
  R.v.textContent = state.v.toFixed(3);
  R.e.textContent = lastE.toFixed(3);
  R.i.textContent = state.I.toFixed(3);
  R.t.textContent = state.t.toFixed(2);

  R.uP.textContent = lastUP.toFixed(2);
  R.uI.textContent = lastUI.toFixed(2);
  R.uD.textContent = lastUD.toFixed(2);
  R.u.textContent  = lastU.toFixed(2);
  R.w.textContent  = P.wind.value.toFixed(2);
}

// ---------- Canvas sizing ---------------------------------------------------
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const plot = document.getElementById("plot");
const pctx = plot.getContext("2d");

function fitCanvas(c, cx) {
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}
const ro = new ResizeObserver(() => { /* read at render time */ });
ro.observe(cv); ro.observe(plot);
window.addEventListener("resize", () => { /* read at render time */ });

// ---------- Rendering: animation -------------------------------------------
const WORLD_X_MIN = 0;
const WORLD_X_MAX = 5;  // show 0..5 m
const WALL_MARGIN_PX = 18;

function world2screen(xm, W) {
  const usable = W - WALL_MARGIN_PX * 2;
  const scale = usable / (WORLD_X_MAX - WORLD_X_MIN);
  return WALL_MARGIN_PX + (xm - WORLD_X_MIN) * scale;
}
function scalePxPerM(W) {
  const usable = W - WALL_MARGIN_PX * 2;
  return usable / (WORLD_X_MAX - WORLD_X_MIN);
}

function drawSpring(x0, y, x1, coils, amp) {
  ctx.beginPath();
  ctx.moveTo(x0, y);
  const len = x1 - x0;
  if (Math.abs(len) < 2) { ctx.lineTo(x1, y); ctx.stroke(); return; }
  const segs = coils * 2;
  const lead = Math.min(10, Math.abs(len) * 0.15) * Math.sign(len);
  const coilStart = x0 + lead;
  const coilEnd = x1 - lead;
  ctx.lineTo(coilStart, y);
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const cx = coilStart + (coilEnd - coilStart) * t;
    const cy = y + (i % 2 === 0 ? -amp : amp);
    ctx.lineTo(cx, cy);
  }
  ctx.lineTo(coilEnd, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
}

function drawArrow(x0, y, dx, color, label, fsize) {
  if (Math.abs(dx) < 0.5) return;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, fsize * 0.14);
  ctx.beginPath();
  ctx.moveTo(x0, y); ctx.lineTo(x0 + dx, y);
  ctx.stroke();
  const head = Math.max(6, fsize * 0.7) * Math.sign(dx);
  const wing = Math.max(3, fsize * 0.35);
  ctx.beginPath();
  ctx.moveTo(x0 + dx, y);
  ctx.lineTo(x0 + dx - head, y - wing);
  ctx.lineTo(x0 + dx - head, y + wing);
  ctx.closePath();
  ctx.fill();
  ctx.font = `${fsize}px ui-sans-serif`;
  ctx.textAlign = dx > 0 ? "left" : "right";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x0 + dx + Math.sign(dx) * 6, y);
}

function render() {
  const sz = fitCanvas(cv, ctx);
  const W = sz.w, H = sz.h;

  const fbase = Math.max(10, Math.min(W, H) * 0.028);
  const fsmall = Math.max(9, Math.min(W, H) * 0.022);

  // bg
  ctx.fillStyle = "#0d1013";
  ctx.fillRect(0, 0, W, H);

  // ground area
  const groundY = Math.round(H * 0.72);
  ctx.strokeStyle = "#2a313c";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, groundY + 22); ctx.lineTo(W, groundY + 22);
  ctx.stroke();
  ctx.fillStyle = "#1a1f27";
  ctx.fillRect(0, groundY + 22, W, H - (groundY + 22));

  const scale = scalePxPerM(W);
  const wallScreenX = world2screen(0, W);

  // x-axis grid in meters
  ctx.strokeStyle = "#1e252f";
  ctx.fillStyle = "#55606f";
  ctx.font = `${fsmall}px ui-sans-serif`;
  ctx.textAlign = "center";
  for (let xm = 0; xm <= WORLD_X_MAX; xm++) {
    const sx = world2screen(xm, W);
    ctx.beginPath();
    ctx.moveTo(sx, groundY + 22);
    ctx.lineTo(sx, groundY + 28);
    ctx.stroke();
    ctx.fillText(xm + " m", sx, groundY + 28 + fsmall + 2);
  }

  // Wall (left hard constraint at world x=0)
  const wallTop = groundY - Math.max(80, H * 0.25);
  const wallH = (groundY + 22) - wallTop;
  ctx.fillStyle = "#2a313c";
  ctx.fillRect(wallScreenX - 16, wallTop, 16, wallH);
  ctx.strokeStyle = "#3a4453";
  ctx.lineWidth = 1;
  const hatchN = Math.max(4, Math.round(wallH / 12));
  for (let i = 0; i < hatchN; i++) {
    const yy = wallTop + (i * wallH) / hatchN;
    ctx.beginPath();
    ctx.moveTo(wallScreenX - 16, yy);
    ctx.lineTo(wallScreenX - 28, yy + (wallH / hatchN) * 0.8);
    ctx.stroke();
  }

  // Cart size — reactive
  const bodyH = Math.max(22, H * 0.07);
  const bodyW = Math.max(50, bodyH * 2.3);
  const wheelR = Math.max(7, bodyH * 0.36);

  // Ground-seated geometry: wheel bottom == ground line; axle centered on body bottom
  const groundLine = groundY + 22;
  const axleY = groundLine - wheelR;
  const cartCy = axleY - bodyH / 2;   // body centered vertically with bottom at the axle

  // Cart screen x
  const cartSx = world2screen(state.x, W);

  // Publish geometry for pointer hit-testing
  viewGeom.W = W; viewGeom.H = H;
  viewGeom.cartSx = cartSx; viewGeom.cartCy = cartCy;
  viewGeom.bodyW = bodyW; viewGeom.bodyH = bodyH;
  viewGeom.wheelR = wheelR; viewGeom.axleY = axleY;

  // ---- Bumper spring (always visible, small dense, from wall to bumper plate)
  const bumperPlateX = world2screen(Math.min(state.x - CART_HALF_W_M, X_BUMP), W);
  const bumperHot = state.x < X_BUMP + 0.02;
  ctx.strokeStyle = bumperHot ? "#ef5350" : "#8a93a3";
  ctx.lineWidth = Math.max(1.5, fsmall * 0.15);
  drawSpring(wallScreenX, cartCy + bodyH * 0.15, bumperPlateX, 6, Math.max(4, bodyH * 0.15));
  // Bumper plate (small vertical bar)
  ctx.fillStyle = bumperHot ? "#ef5350" : "#5a6575";
  ctx.fillRect(bumperPlateX - 2, cartCy + bodyH * 0.15 - bodyH * 0.22, 4, bodyH * 0.44);

  // ---- Main spring (wall to cart left-edge hook), at cart centerline height
  const hookX = cartSx - bodyW / 2 - 6;
  ctx.strokeStyle = "#c0c9d8";
  ctx.lineWidth = Math.max(1.5, fsmall * 0.18);
  drawSpring(wallScreenX, cartCy - bodyH * 0.15, hookX, 10, Math.max(5, bodyH * 0.22));

  // ---- Reference marker (dotted vertical)
  const refSx = world2screen(P.ref.value, W);
  ctx.strokeStyle = "#66bb6a";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(refSx, wallTop - 12); ctx.lineTo(refSx, groundY + 22);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#66bb6a";
  ctx.beginPath();
  ctx.moveTo(refSx, wallTop - 14);
  ctx.lineTo(refSx - 6, wallTop - 24);
  ctx.lineTo(refSx + 6, wallTop - 24);
  ctx.closePath();
  ctx.fill();
  ctx.font = `${fsmall}px ui-sans-serif`;
  ctx.textAlign = "center";
  ctx.fillText("ref " + P.ref.value.toFixed(2), refSx, wallTop - 28);

  // ---- Cart center marker (dotted vertical + downward triangle)
  ctx.strokeStyle = "#4ea1ff";
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(cartSx, wallTop - 4); ctx.lineTo(cartSx, groundY + 22);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#4ea1ff";
  ctx.beginPath();
  ctx.moveTo(cartSx, groundY + 22 + 4);
  ctx.lineTo(cartSx - 5, groundY + 22 + 12);
  ctx.lineTo(cartSx + 5, groundY + 22 + 12);
  ctx.closePath();
  ctx.fill();

  // ---- Cart body
  ctx.fillStyle = "#2b3340";
  ctx.strokeStyle = "#6a7384";
  ctx.lineWidth = Math.max(1, fsmall * 0.12);
  ctx.beginPath();
  ctx.moveTo(cartSx - bodyW/2, cartCy - bodyH/2);
  ctx.lineTo(cartSx + bodyW/2, cartCy - bodyH/2);
  ctx.lineTo(cartSx + bodyW/2 + 6, cartCy + bodyH/2);
  ctx.lineTo(cartSx - bodyW/2 - 6, cartCy + bodyH/2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // window strip
  ctx.fillStyle = "#4ea1ff33";
  ctx.strokeStyle = "#4ea1ff88";
  ctx.beginPath();
  ctx.rect(cartSx - bodyW/2 + 6, cartCy - bodyH/2 + 4, bodyW - 12, bodyH * 0.35);
  ctx.fill(); ctx.stroke();
  // spring hook stub
  ctx.strokeStyle = "#9aa4b4";
  ctx.beginPath();
  ctx.moveTo(cartSx - bodyW/2 - 6, cartCy - bodyH * 0.15);
  ctx.lineTo(cartSx - bodyW/2, cartCy - bodyH * 0.15);
  ctx.stroke();
  // wheels — ground-locked rolling: θ = x / r where r is the wheel radius in meters
  const wheelR_m = wheelR / scale;
  const wheelAngle = state.x / Math.max(1e-6, wheelR_m);
  const wxs = [cartSx - bodyW/3, cartSx + bodyW/3];
  for (const wx of wxs) {
    ctx.fillStyle = "#12161c";
    ctx.strokeStyle = "#6a7384";
    ctx.lineWidth = Math.max(1, fsmall * 0.12);
    ctx.beginPath();
    ctx.arc(wx, axleY, wheelR, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // spoke
    ctx.strokeStyle = "#e6e9ef";
    ctx.lineWidth = Math.max(1.2, fsmall * 0.14);
    ctx.beginPath();
    ctx.moveTo(wx, axleY);
    ctx.lineTo(
      wx + Math.cos(wheelAngle) * (wheelR - 2),
      axleY + Math.sin(wheelAngle) * (wheelR - 2)
    );
    ctx.stroke();
    // second spoke 90° offset for clearer visual rolling
    ctx.beginPath();
    ctx.moveTo(wx, axleY);
    ctx.lineTo(
      wx + Math.cos(wheelAngle + Math.PI / 2) * (wheelR - 2),
      axleY + Math.sin(wheelAngle + Math.PI / 2) * (wheelR - 2)
    );
    ctx.stroke();
  }

  // ---- Stacked force arrows (from cart centerline, horizontal) --------------
  // Length scale: N -> px. Cap visually so huge forces don't scream off-screen.
  const F_PX_PER_N = Math.min(0.8, (W * 0.18) / 200);
  const F_CAP_PX = Math.min(W * 0.35, 300);

  function fxDx(F) {
    let dx = F * F_PX_PER_N;
    if (Math.abs(dx) > F_CAP_PX) dx = Math.sign(dx) * F_CAP_PX;
    return dx;
  }
  // Slot positions above cart (from bottom up)
  const topY = cartCy - bodyH / 2;
  const slotGap = Math.max(14, fbase * 1.35);
  const slots = [
    { y: topY - slotGap * 1, color: getVar("--cU"), F: lastU,      label: "u"    },
    { y: topY - slotGap * 2, color: getVar("--cP"), F: lastUP,     label: "P"    },
    { y: topY - slotGap * 3, color: getVar("--cI"), F: lastUI,     label: "I"    },
    { y: topY - slotGap * 4, color: getVar("--cD"), F: lastUD,     label: "D"    },
    { y: topY - slotGap * 5, color: getVar("--cW"), F: P.wind.value, label: "wind" },
  ];
  for (const s of slots) {
    drawArrow(cartSx, s.y, fxDx(s.F), s.color, `${s.label} ${s.F.toFixed(0)}`, fsmall);
  }
}

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#fff";
}

// ---------- Plot rendering --------------------------------------------------
function drawPlotGrid(px, py, pw, ph, yMin, yMax, tMin, tMax, title, fsize) {
  // frame
  pctx.fillStyle = "#0d1013";
  pctx.fillRect(px, py, pw, ph);
  pctx.strokeStyle = "#2a313c";
  pctx.lineWidth = 1;
  pctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);

  // axes ticks
  pctx.fillStyle = "#55606f";
  pctx.font = `${fsize}px ui-sans-serif`;
  pctx.textBaseline = "middle";
  pctx.textAlign = "right";
  const yTicks = 3;
  for (let i = 0; i <= yTicks; i++) {
    const frac = i / yTicks;
    const yv = yMax - frac * (yMax - yMin);
    const yy = py + frac * ph;
    pctx.strokeStyle = "#1e252f";
    pctx.beginPath();
    pctx.moveTo(px + 34, yy); pctx.lineTo(px + pw, yy);
    pctx.stroke();
    pctx.fillStyle = "#55606f";
    pctx.fillText(yv.toFixed(1), px + 32, yy);
  }
  pctx.textAlign = "center";
  pctx.textBaseline = "top";
  const xTicks = 4;
  for (let i = 0; i <= xTicks; i++) {
    const frac = i / xTicks;
    const tv = tMin + frac * (tMax - tMin);
    const xx = px + 34 + frac * (pw - 38);
    pctx.strokeStyle = "#1e252f";
    pctx.beginPath();
    pctx.moveTo(xx, py); pctx.lineTo(xx, py + ph - 14);
    pctx.stroke();
    pctx.fillStyle = "#55606f";
    pctx.fillText(tv.toFixed(1) + "s", xx, py + ph - 12);
  }
  // title
  pctx.fillStyle = "#8a93a3";
  pctx.font = `${fsize}px ui-sans-serif`;
  pctx.textAlign = "left"; pctx.textBaseline = "top";
  pctx.fillText(title, px + 6, py + 4);
}

function plotLine(px, py, pw, ph, yMin, yMax, tMin, tMax, pts, color, lw, dash) {
  if (!pts || pts.length < 2) return;
  pctx.strokeStyle = color;
  pctx.lineWidth = lw || 1.5;
  pctx.setLineDash(dash || []);
  pctx.beginPath();
  const x0 = px + 34;
  const usableW = pw - 38;
  const yRange = (yMax - yMin) || 1;
  const tRange = (tMax - tMin) || 1;
  let started = false;
  for (const p of pts) {
    const xx = x0 + ((p.t - tMin) / tRange) * usableW;
    const yy = py + (1 - (p.y - yMin) / yRange) * ph;
    if (!started) { pctx.moveTo(xx, yy); started = true; }
    else pctx.lineTo(xx, yy);
  }
  pctx.stroke();
  pctx.setLineDash([]);
}

function renderPlots() {
  const sz = fitCanvas(plot, pctx);
  const W = sz.w, H = sz.h;
  pctx.fillStyle = "#0d1013";
  pctx.fillRect(0, 0, W, H);

  const fsize = Math.max(9, Math.min(W, H) * 0.03);
  const pad = 6;
  const topH = Math.floor((H - pad * 3) / 2);
  const botH = H - pad * 3 - topH;

  // Determine time window
  const tMax = Math.max(state.t, HIST_WINDOW_S);
  const tMin = tMax - HIST_WINDOW_S;

  // --- Top plot: ref & x vs time
  // Always include 0 and 5 in frame. Extend in 1m increments if data exceeds.
  let dMin = 0, dMax = WORLD_X_MAX;
  const showBand = state.mode === "bangbang";
  for (const h of hist) {
    if (h.t < tMin) continue;
    if (h.ref < dMin) dMin = h.ref; if (h.ref > dMax) dMax = h.ref;
    if (h.x   < dMin) dMin = h.x;   if (h.x   > dMax) dMax = h.x;
    if (showBand) {
      if (h.deadLo < dMin) dMin = h.deadLo; if (h.deadHi > dMax) dMax = h.deadHi;
    }
  }
  let yLo = Math.min(0, Math.floor(dMin));
  let yHi = Math.max(WORLD_X_MAX, Math.ceil(dMax));

  const px = pad, py = pad;
  const pw = W - pad * 2;
  drawPlotGrid(px, py, pw, topH, yLo, yHi, tMin, tMax, "position vs time (m)", fsize);
  // legend
  pctx.textAlign = "right"; pctx.textBaseline = "top";
  {
    const legend = [
      { color: getVar("--cRef"), label: "ref" },
      { color: getVar("--cX"),   label: "x" },
    ];
    if (showBand) legend.push({ color: "#ef5350", label: "deadband" });
    drawLegend(px + pw - 6, py + 4, fsize, legend);
  }
  // lines
  const winHist = hist.filter(h => h.t >= tMin);
  const refPts = winHist.map(h => ({ t: h.t, y: h.ref }));
  const xPts   = winHist.map(h => ({ t: h.t, y: h.x }));
  if (showBand) {
    const hiPts = winHist.map(h => ({ t: h.t, y: h.deadHi }));
    const loPts = winHist.map(h => ({ t: h.t, y: h.deadLo }));
    plotLine(px, py, pw, topH, yLo, yHi, tMin, tMax, hiPts, "#ef5350", 1, [4, 4]);
    plotLine(px, py, pw, topH, yLo, yHi, tMin, tMax, loPts, "#ef5350", 1, [4, 4]);
  }
  plotLine(px, py, pw, topH, yLo, yHi, tMin, tMax, refPts, getVar("--cRef"), 1.5);
  plotLine(px, py, pw, topH, yLo, yHi, tMin, tMax, xPts,   getVar("--cX"),   2);

  // --- Bottom plot: effort vs time
  // Symmetric about 0, range ±N*50 where N is smallest integer ≥1 that contains all data.
  const py2 = py + topH + pad;
  let fAbs = 0;
  for (const h of hist) {
    if (h.t < tMin) continue;
    for (const v of [h.uP, h.uI, h.uD, h.u, h.wind]) {
      const a = Math.abs(v);
      if (a > fAbs) fAbs = a;
    }
  }
  const STEP = 50;
  const fHi = Math.max(STEP, Math.ceil(fAbs / STEP) * STEP);
  const fLo = -fHi;
  drawPlotGrid(px, py2, pw, botH, fLo, fHi, tMin, tMax, "control effort (N)", fsize);
  drawLegend(px + pw - 6, py2 + 4, fsize, [
    { color: getVar("--cU"), label: "u" },
    { color: getVar("--cP"), label: "P" },
    { color: getVar("--cI"), label: "I" },
    { color: getVar("--cD"), label: "D" },
    { color: getVar("--cW"), label: "wind" },
  ]);
  const pick = (key) => hist.filter(h => h.t >= tMin).map(h => ({ t: h.t, y: h[key] }));
  plotLine(px, py2, pw, botH, fLo, fHi, tMin, tMax, pick("uP"),   getVar("--cP"), 1.2);
  plotLine(px, py2, pw, botH, fLo, fHi, tMin, tMax, pick("uI"),   getVar("--cI"), 1.2);
  plotLine(px, py2, pw, botH, fLo, fHi, tMin, tMax, pick("uD"),   getVar("--cD"), 1.2);
  plotLine(px, py2, pw, botH, fLo, fHi, tMin, tMax, pick("wind"), getVar("--cW"), 1.2);
  plotLine(px, py2, pw, botH, fLo, fHi, tMin, tMax, pick("u"),    getVar("--cU"), 2);
}

function drawLegend(rightX, topY, fsize, entries) {
  pctx.font = `${fsize}px ui-sans-serif`;
  pctx.textAlign = "right"; pctx.textBaseline = "top";
  let y = topY;
  for (const e of entries) {
    pctx.fillStyle = e.color;
    pctx.fillText("■ " + e.label, rightX, y);
    y += fsize + 2;
  }
}

// ---------- Pointer drag on cart --------------------------------------------
function screenXToWorld(sx, W) {
  const usable = W - WALL_MARGIN_PX * 2;
  const scale = usable / (WORLD_X_MAX - WORLD_X_MIN);
  return (sx - WALL_MARGIN_PX) / scale + WORLD_X_MIN;
}
function hitTestCart(mx, my) {
  const g = viewGeom;
  const halfW = g.bodyW / 2 + 8;
  const top = g.cartCy - g.bodyH / 2 - 4;
  const bot = g.axleY + g.wheelR + 2;
  return mx >= g.cartSx - halfW && mx <= g.cartSx + halfW && my >= top && my <= bot;
}
function clientToCanvas(ev) {
  const r = cv.getBoundingClientRect();
  return { mx: ev.clientX - r.left, my: ev.clientY - r.top };
}
cv.addEventListener("pointermove", (ev) => {
  const { mx, my } = clientToCanvas(ev);
  if (state.dragging) {
    const wx = screenXToWorld(mx, viewGeom.W) - state.dragOffsetM;
    const minX = CART_HALF_W_M;
    const maxX = WORLD_X_MAX - CART_HALF_W_M;
    state.x = Math.max(minX, Math.min(maxX, wx));
    state.v = 0;
    ev.preventDefault();
  } else {
    cv.style.cursor = hitTestCart(mx, my) ? "grab" : "default";
  }
});
cv.addEventListener("pointerdown", (ev) => {
  const { mx, my } = clientToCanvas(ev);
  if (!hitTestCart(mx, my)) return;
  state.dragging = true;
  // Preserve click offset so cart doesn't jump to pointer center
  const pointerWorldX = screenXToWorld(mx, viewGeom.W);
  state.dragOffsetM = pointerWorldX - state.x;
  state.v = 0;
  cv.setPointerCapture(ev.pointerId);
  cv.classList.add("grabbing");
  cv.style.cursor = "grabbing";
  ev.preventDefault();
});
function endDrag(ev) {
  if (!state.dragging) return;
  state.dragging = false;
  state.v = 0;
  try { cv.releasePointerCapture(ev.pointerId); } catch {}
  cv.classList.remove("grabbing");
  cv.style.cursor = "default";
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("pointerleave", (ev) => { if (state.dragging) endDrag(ev); });

// ---------- Go ---------------------------------------------------------------
resetState();
requestAnimationFrame(step);
</script>
</body>
