<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotational Transmission</title>
<link rel="stylesheet" href="../../lib/shell.css">
</head>
<body>
<!--
  Rotational-transmission lesson hub. Each lesson registers its spec on
  window.RotationalLessons via its own *.js file; this page collects them
  and mounts via LIB.App.runTabs.
-->
<script src="../../lib/util.js"></script>
<script src="../../lib/canvas-type.js"></script>
<script src="../../lib/registry.js"></script>
<script src="../../lib/plot.js"></script>
<script src="../../lib/integrate.js"></script>
<script src="../../lib/draw.js"></script>
<script src="../../lib/thermal.js"></script>
<script src="../../lib/match-hint.js"></script>
<script src="../../lib/pid.js"></script>
<script src="../../lib/drag-smoother.js"></script>
<script src="../../lib/drag.js"></script>
<script src="../../lib/lash.js"></script>
<script src="../../lib/wheel-chain.js"></script>
<script src="../../lib/wheel-chain-view.js"></script>
<script src="../../lib/gear-render.js"></script>
<script src="../../lib/belt-render.js"></script>
<script src="../../lib/header-buttons.js"></script>
<script src="../../lib/app.js"></script>
<script src="./gears.js"></script>
<script src="./backlash.js"></script>
<script src="./belt-and-pulley.js"></script>
<script src="./whole-system.js"></script>
<script>
  LIB.App.runTabs({
    title: "Rotational Transmission",
    persistKey: "rotational-transmission-active-lesson",
    tabs: [
      { label: "gears",            spec: window.RotationalLessons.gears         },
      { label: "backlash",         spec: window.RotationalLessons.backlash      },
      { label: "belt-and-pulley",  spec: window.RotationalLessons.beltAndPulley },
      { label: "whole-system",     spec: window.RotationalLessons.wholeSystem   },
    ],
  });
</script>
</body>
</html>
