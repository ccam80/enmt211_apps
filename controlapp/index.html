// ============================================================================
// Build example UI
// ============================================================================

const refRowEl = document.getElementById("ref-row");
const ctlTabsEl = document.getElementById("ctl-tabs");
const ctlBodiesEl = document.getElementById("ctl-bodies");
const sysRowsEl = document.getElementById("sys-rows");
const sysNoteEl = document.getElementById("sys-note");
const stateReadEl = document.getElementById("readout-state");
const forceReadEl = document.getElementById("readout-forces");
const ctlTitleEl = document.getElementById("ctl-title");

function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function buildExampleUI(ex) {
  // Reset header
  // Reference row
  clearChildren(refRowEl);
  const h = document.createElement("h2");
  h.style.cssText = "margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:600;";
  h.textContent = "Reference / Target";
  refRowEl.appendChild(h);
  ex.refRowBuild(refRowEl);

  // Controller tabs
  clearChildren(ctlTabsEl);
  clearChildren(ctlBodiesEl);
  ctlTitleEl.textContent = (ex.controllerTabs.length === 1)
    ? "Controller — " + ex.controllerTabs[0].label
    : "Controllers";
  ex.controllerTabs.forEach((tab, idx) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.dataset.tab = tab.id;
    btn.textContent = tab.label;
    if (idx === 0) btn.classList.add("active");
    btn.addEventListener("click", () => activateTab(ex, tab.id));
    ctlTabsEl.appendChild(btn);
    const body = document.createElement("div");
    body.dataset.body = tab.id;
    body.className = "tab-body";
    if (idx > 0) body.hidden = true;
    for (const k of tab.paramKeys) {
      mkRow(body, ex.params[k]);
    }
    if (tab.note) {
      const note = document.createElement("div");
      note.style.cssText = "color:var(--muted);font-size:11px;line-height:1.4;";
      note.innerHTML = tab.note;
      body.appendChild(note);
    }
    ctlBodiesEl.appendChild(body);
    if (idx === 0) {
      // For single-mode examples (rover) just leave it; for car/heli the first tab's id is "pid"
      ex.setMode(tab.id);
    }
  });

  // System rows (read-only)
  clearChildren(sysRowsEl);
  for (const k of ex.systemKeys) {
    mkRow(sysRowsEl, ex.params[k]);
  }
  sysNoteEl.textContent = ex.systemNote || "";

  // Readout
  clearChildren(stateReadEl);
  for (const s of ex.stateRowSpecs) {
    const ln = document.createElement("div");
    ln.className = "ln";
    ln.innerHTML = `<span>${s.label}</span><b><span data-rs="${s.id}">--</span> ${s.units || ""}</b>`;
    stateReadEl.appendChild(ln);
  }
  clearChildren(forceReadEl);
  for (const f of ex.forceRowSpecs) {
    const ln = document.createElement("div");
    ln.className = "ln";
    const sw = f.color ? `<i class="swatch" style="background:var(${f.color})"></i>` : "";
    ln.innerHTML = `<span>${sw}${f.label}</span><b data-rf="${f.id}">--</b>`;
    forceReadEl.appendChild(ln);
  }

  ex.activate();
}

function activateTab(ex, tabId) {
  for (const btn of ctlTabsEl.querySelectorAll("button")) {
    btn.classList.toggle("active", btn.dataset.tab === tabId);
  }
  for (const body of ctlBodiesEl.querySelectorAll(".tab-body")) {
    body.hidden = (body.dataset.body !== tabId);
  }
  // For car/heli the tab id is the controller mode.  For rover it's just a sub-pane label.
  if (ex.id === "rover") return;
  ex.setMode(tabId);
  notifyControlChange();
}

// ============================================================================
// Switching examples
// ============================================================================

const exTabs = document.getElementById("ex-tabs");
exTabs.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-ex]");
  if (!btn) return;
  const id = btn.dataset.ex;
  const ex = examples.find(x => x.id === id);
  if (!ex) return;
  for (const b of exTabs.querySelectorAll("button")) b.classList.toggle("active", b === btn);
  switchExample(ex);
});

function switchExample(ex) {
  currentExample = ex;
  state_paused = false;
  document.getElementById("btn-pause").textContent = "Pause";
  buildExampleUI(ex);
  ex.resetState();
}

// ============================================================================
// Pointer (rover click)
// ============================================================================

cv.addEventListener("click", (ev) => {
  if (!currentExample.onPointer) return;
  const r = cv.getBoundingClientRect();
  currentExample.onPointer("click", ev.clientX - r.left, ev.clientY - r.top, r.width, r.height);
});

// ============================================================================
// Reset / pause / loop
// ============================================================================

let state_paused = false;
document.getElementById("btn-reset").addEventListener("click", () => {
  currentExample.resetState();
});
document.getElementById("btn-pause").addEventListener("click", (e) => {
  state_paused = !state_paused;
  e.target.textContent = state_paused ? "Resume" : "Pause";
});

// ============================================================================
// Loop
// ============================================================================

const PHYS_HZ = 240;
const PHYS_DT = 1 / PHYS_HZ;
let accumulator = 0;
let lastMs = performance.now();
let fpsFrames = 0, fpsT = performance.now(), fpsVal = 0;

const overlayEl = document.getElementById("overlay");
const badgeEl = document.getElementById("badge");

function step(nowMs) {
  const dt = Math.min(0.1, (nowMs - lastMs) / 1000);
  lastMs = nowMs;
  if (!state_paused) {
    accumulator += dt;
    if (accumulator > 0.25) accumulator = 0.25;
    while (accumulator >= PHYS_DT) {
      currentExample.step(PHYS_DT);
      updateHold(PHYS_DT);
      accumulator -= PHYS_DT;
    }
  }
  render();
  renderPlots();
  updateReadout();
  updateOverlay();
  fpsFrames++;
  if (nowMs - fpsT >= 500) {
    fpsVal = Math.round((fpsFrames * 1000) / (nowMs - fpsT));
    fpsFrames = 0; fpsT = nowMs;
  }
  requestAnimationFrame(step);
}

function render() {
  const sz = fitCanvas(cv, ctx);
  currentExample.render(ctx, sz.w, sz.h);
}

function updateOverlay() {
  if (hold.controlled) {
    overlayEl.classList.add("controlled");
    badgeEl.hidden = false;
    badgeEl.classList.add("controlled");
    badgeEl.innerHTML = `<span class="tick">✓</span>System Controlled!`;
  } else if (hold.inBand) {
    overlayEl.classList.remove("controlled");
    badgeEl.hidden = false;
    badgeEl.classList.remove("controlled");
    const remain = Math.max(0, HOLD_DURATION_S - hold.bandT);
    badgeEl.textContent = "At target… " + remain.toFixed(1) + " s";
  } else {
    overlayEl.classList.remove("controlled");
    badgeEl.hidden = true;
    badgeEl.classList.remove("controlled");
  }
}

function updateReadout() {
  const v = currentExample.readoutValues();
  for (const [id, val] of Object.entries(v.state)) {
    const el = stateReadEl.querySelector(`[data-rs="${id}"]`);
    if (el) el.textContent = val;
  }
  for (const [id, val] of Object.entries(v.force)) {
    const el = forceReadEl.querySelector(`[data-rf="${id}"]`);
    if (el) el.textContent = val;
  }
}

function renderPlots() {
  const sz = fitCanvas(plot, pctx);
  const W = sz.w, H = sz.h;
  pctx.fillStyle = "#0d1013";
  pctx.fillRect(0, 0, W, H);
  const fsize = Math.max(9, Math.min(W, H) * 0.030);
  const pad = 6;
  const topH = Math.floor((H - pad * 3) / 2);
  const botH = H - pad * 3 - topH;

  const tMax = Math.max(currentExample.state.t, HIST_WINDOW_S);
  const tMin = tMax - HIST_WINDOW_S;
  const cfg = currentExample.plotConfig;

  // Top plot
  let dMin = cfg.top.yMinFloor, dMax = cfg.top.yMaxCeil;
  const winHist = hist.filter(h => h.t >= tMin);
  const showBand = cfg.top.bandFromMode && cfg.top.bandFromMode();
  for (const h of winHist) {
    for (const yk of cfg.top.yKeys) {
      const v = h[yk.key];
      if (Number.isFinite(v)) { if (v < dMin) dMin = v; if (v > dMax) dMax = v; }
    }
    if (showBand && Number.isFinite(h.deadHi) && Number.isFinite(h.deadLo)) {
      if (h.deadLo < dMin) dMin = h.deadLo;
      if (h.deadHi > dMax) dMax = h.deadHi;
    }
  }
  const yLo = Math.floor(dMin), yHi = Math.ceil(dMax);

  const px = pad, py = pad, pw = W - pad * 2;
  drawPlotGrid(pctx, px, py, pw, topH, yLo, yHi, tMin, tMax, cfg.top.title, fsize);
  const legendTop = cfg.top.yKeys.map(k => ({ color:k.color, label:k.label }));
  if (showBand) legendTop.push({ color:"#ef5350", label:"deadband" });
  drawLegend(pctx, px + pw - 6, py + 4, fsize, legendTop);
  if (showBand) {
    const hi = winHist.map(h => ({ t: h.t, y: h.deadHi }));
    const lo = winHist.map(h => ({ t: h.t, y: h.deadLo }));
    plotLine(pctx, px, py, pw, topH, yLo, yHi, tMin, tMax, hi, "#ef5350", 1, [4,4]);
    plotLine(pctx, px, py, pw, topH, yLo, yHi, tMin, tMax, lo, "#ef5350", 1, [4,4]);
  }
  for (const yk of cfg.top.yKeys) {
    const pts = winHist.map(h => ({ t: h.t, y: h[yk.key] }));
    plotLine(pctx, px, py, pw, topH, yLo, yHi, tMin, tMax, pts, yk.color, yk.width || 1.5, yk.dash);
  }

  // Bottom plot — symmetric ±step
  const py2 = py + topH + pad;
  let fAbs = 0;
  for (const h of winHist) {
    for (const yk of cfg.bottom.yKeys) {
      const v = h[yk.key];
      if (Number.isFinite(v)) {
        const a = Math.abs(v);
        if (a > fAbs) fAbs = a;
      }
    }
  }
  const STEP = 50;
  const fHi = Math.max(STEP, Math.ceil(fAbs / STEP) * STEP);
  const fLo = -fHi;
  drawPlotGrid(pctx, px, py2, pw, botH, fLo, fHi, tMin, tMax, cfg.bottom.title, fsize);
  drawLegend(pctx, px + pw - 6, py2 + 4, fsize,
    cfg.bottom.yKeys.map(k => ({ color:k.color, label:k.label })));
  for (const yk of cfg.bottom.yKeys) {
    const pts = winHist.map(h => ({ t: h.t, y: h[yk.key] }));
    plotLine(pctx, px, py2, pw, botH, fLo, fHi, tMin, tMax, pts, yk.color, yk.width || 1.5, yk.dash);
  }
}

// ============================================================================
// Boot
// ============================================================================

switchExample(carEx);
requestAnimationFrame(step);
</script>
